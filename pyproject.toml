[project]
name = "ragbench"
version = "0.1.0"
description = "Config-driven benchmarking platform for Retrieval-Augmented Generation pipelines"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Harshit Sinha", email = "harshitsinha1024@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bm25s==0.3.16",
    "fastembed==0.9.1",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pgvector==0.5.1",
    "psutil==7.2.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "qdrant-client==1.20.0",
    "rich==15.0.0",
    "sentence-transformers==6.2.0",
    "tiktoken==0.14.0",
    "torch==2.15.0",
    "typer==0.27.3",
]

[project.scripts]
ragbench = "ragbench.cli:main"

[tool.uv]
# Keep package downloads on the project drive (C: is space-constrained).
# Consumers: see Makefile `export UV_CACHE_DIR`.

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
exclude = [".venv", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/ragbench/cli.py" = ["B008"]

[tool.mypy]
strict = true
files = ["src/ragbench"]
ignore_missing_imports = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require docker services (pgvector/qdrant)",
]
