[project]
name = "ragbench"
version = "0.1.0"
description = "Config-driven benchmarking platform for Retrieval-Augmented Generation pipelines"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Harshit Sinha", email = "harshitsinha1024@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "numpy==2.5.4",
    "psutil==7.2.2",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "typer==0.27.3",
]

[project.scripts]
ragbench = "ragbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]
