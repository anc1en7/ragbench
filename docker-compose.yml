name: ragbench

services:
  pgvector:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_USER: ragbench
      POSTGRES_PASSWORD: ragbench
      POSTGRES_DB: ragbench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbench"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional viewer for OpenTelemetry traces (enable with --profile phoenix)
  phoenix:
    image: arizephoenix/phoenix:latest@sha256:095f498723ec1fa3b55592af83d5a1e3bf026ba15a4a44e325f20dfdbb71452a
    profiles: ["phoenix"]
    ports:
      - "6006:6006"

volumes:
  pgdata: {}
  qdrant_data: {}
