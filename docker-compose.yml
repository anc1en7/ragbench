name: ragbench

services:
  pgvector:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_USER: ragbench
      POSTGRES_PASSWORD: ragbench
      POSTGRES_DB: ragbench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbench"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional viewer for OpenTelemetry traces (enable with --profile phoenix)
  phoenix:
    image: arizephoenix/phoenix:latest@sha256:095f498723ec1fa3b55592af83d5a1e3bf026ba15a4a44e325f20dfdbb71452a
    profiles: ["phoenix"]
    ports:
      - "6006:6006"

  # Query API (enable with --profile app). Indexes a config on first query if needed.
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    profiles: ["app"]
    env_file: [{path: .env, required: false}]
    environment:
      PG_DSN: postgresql://ragbench:ragbench@pgvector:5432/ragbench
      QDRANT_URL: http://qdrant:6333
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results:ro
      - ./configs:/app/configs:ro
      - hf_cache:/cache/hf
    depends_on:
      pgvector: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  # Replay dashboard over results/ (enable with --profile app)
  dashboard:
    build: {context: ., dockerfile: Dockerfile.dashboard}
    profiles: ["app"]
    ports:
      - "8501:8501"
    volumes:
      - ./results:/app/results:ro

volumes:
  hf_cache: {}
  pgdata: {}
  qdrant_data: {}
